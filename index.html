<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./src/styles.css">
  <title>Spritesheet Generator</title>
</head>

<body>
  <label class="theme-toggle" aria-label="Toggle color theme" title="Toggle color theme">
    <input type="checkbox" />
    <span class="theme-toggle__icon" aria-hidden="true">
      <svg class="sun-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
        stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="4.5"></circle>
        <path d="M12 2.5v2"></path>
        <path d="M12 19.5v2"></path>
        <path d="M4.5 12H2.5"></path>
        <path d="M21.5 12h-2"></path>
        <path d="M5.6 5.6l-1.4-1.4"></path>
        <path d="M19.8 19.8l-1.4-1.4"></path>
        <path d="M5.6 18.4l-1.4 1.4"></path>
        <path d="M19.8 4.2l-1.4 1.4"></path>
      </svg>
      <svg class="moon-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
        stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"></path>
      </svg>
    </span>
  </label>

  <div class="container">
    <h1>Spritesheet Generator</h1>

    <div class="panel">
      <h2>1. Upload Images</h2>
      <!-- Drag and Drop Upload Zone -->
      <div id="dropZone" class="drop-zone">
        <p>Drag & Drop images here or</p>
        <div class="input-group">
          <input type="file" id="imageInput" multiple accept="image/*" />
          <button id="addImages">Browse Files</button>
        </div>
      </div>

      <div id="imageContainer">
        <!-- Placeholder text -->
        <span class="placeholder">Your uploaded images will appear here</span>

        <!-- Info icon & hint moved inside to anchor relative to imageContainer -->
        <div class="hint">
          <span class="info-icon">i</span>
          <span class="hint-text">Customize images' order in the spritesheet by dragging the thumbnails below.</span>
        </div>
      </div>
    </div>

    <div class="panel">
      <h2>2. Configuration</h2>

      <div class="settings-grid">
        <div class="setting-item">
          <label for="spriteName">Sprite Name:</label>
          <input type="text" id="spriteName" placeholder="sprite" />
        </div>

        <div class="setting-item">
          <label for="spriteMargin">Margin (px):</label>
          <input type="number" id="spriteMargin" value="5" min="0" />
        </div>

        <div class="setting-item">
          <label for="spriteExtrude" title="Repeats the edge pixels to prevent texture bleeding">Extrude (px):</label>
          <input type="number" id="spriteExtrude" value="0" min="0" />
        </div>

        <div class="setting-item">
          <label for="exportFormat">Data Format:</label>
          <select id="exportFormat">
            <option value="css">CSS</option>
            <option value="json">JSON (TexturePacker)</option>
          </select>
        </div>
      </div>

      <div class="layout-options">
        <label><input type="radio" name="layout" value="vertical" checked /> Vertical</label>
        <label><input type="radio" name="layout" value="horizontal" /> Horizontal</label>
        <label><input type="radio" name="layout" value="grid" /> Grid</label>
      </div>
    </div>

    <div class="panel actions">
      <h2>3. Generate & Export</h2>
      <div class="button-group">
        <button id="previewSprite">Preview Sprite</button>
        <button id="downloadSprite" class="primary">Download Files</button>
        <button id="resetAll">Clear / Reset</button>
      </div>

      <!-- Smart Canvas Preview -->
      <div class="zoom-controls">
        <label for="canvasZoom">Preview Zoom:</label>
        <input type="range" id="canvasZoom" min="10" max="200" value="100">
        <span id="zoomValue">100%</span>
      </div>
      <div class="canvas-wrapper">
        <canvas id="spriteCanvas"></canvas>
      </div>
    </div>

    <div class="panel output-panel">
      <h2 id="outputLabel">Output Data (CSS)</h2>
      <div class="editor-container">
        <button id="copyCode" class="copy-btn" title="Copy to clipboard">
          <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"
            stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
          </svg>
        </button>
        <textarea id="dataOutput" readonly placeholder="Your generated CSS or JSON will appear here..."></textarea>
      </div>
    </div>
  </div>

  <script src="./src/main.js"></script>
</body>

</html>
